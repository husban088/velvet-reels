<!DOCTYPE html><html lang="en" data-bs-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070608"><meta name="description" content="Velvet Reel - a luxury cinema experience. Discover films, save your watchlist and book your seats."><title>Sign in | Velvet Reel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070608'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E"><link href="css/style.css" rel="stylesheet"></head><body class="inner"><div id="nav"></div>

<section class="phead"><div class="container"><div class="auth rv"><span class="eyebrow text-center">Welcome back</span><h1 class="text-center" style="font-size:clamp(2.2rem,5vw,3.2rem)">Sign in</h1><form id="f" class="box mt-4 needs-validation" novalidate><div class="alert alert-danger py-2 d-none" id="err"></div><div class="mb-3"><label class="form-label" for="e">Email</label><input id="e" type="email" class="form-control" placeholder="you@example.com" required></div><div class="mb-4"><label class="form-label" for="p">Password</label><input id="p" type="password" class="form-control" placeholder="Your password" required></div><button class="btn btn-gold w-100">Sign in</button><p class="mu text-center mt-3 mb-0">New here? <a href="signup.html" id="go" class="text-warning">Create an account</a></p></form></div></div></section>
<div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js"></script><script src="js/data.js"></script><script src="js/main.js"></script><script>
const next=(()=>{const n=new URLSearchParams(location.search).get('next')||'';return /^[a-z0-9-]+\.html(\?[\w=&%.-]*)?$/i.test(n)?n:'index.html'})();
if(U())location.replace(next);
function showErr(t){const x=$('#err');x.textContent=t;x.classList.remove('d-none')}

$('#go').href='signup.html'+location.search;
$('#f').onsubmit=async e=>{e.preventDefault();const f=e.target;if(!f.checkValidity()){f.classList.add('was-validated');return}
  const em=$('#e').value.trim().toLowerCase(),pw=await sha($('#p').value),u=LS.get('vr_users',[]).find(x=>x.email==em&&x.pw==pw);
  if(!u){showErr('Wrong email or password.');return}
  LS.set('vr_user',{name:u.name,email:u.email});toast('Welcome back, '+u.name.split(' ')[0]);setTimeout(()=>location.href=next,600)};
reveal();

</script></body></html>
