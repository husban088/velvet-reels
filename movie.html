<!DOCTYPE html><html lang="en" data-bs-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070608"><meta name="description" content="Velvet Reel - a luxury cinema experience. Discover films, save your watchlist and book your seats."><title>Movie | Velvet Reel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070608'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E"><link href="css/style.css" rel="stylesheet"></head><body class="inner"><div id="nav"></div>

<header class="gh" id="gh"></header>
<section class="sec pt-4"><div class="container"><div class="row g-4"><div class="col-lg-8"><h2>The story</h2><p class="mu fs-5" id="ab"></p><h3 class="mt-4">Highlights</h3><ul class="hl" id="ft"></ul><h3 class="mt-5 mb-3">Cast</h3><div class="d-flex flex-wrap gap-2" id="cast"></div></div><div class="col-lg-4"><div class="box mb-3" id="sp"></div><div class="box text-center"><span class="eyebrow">Tickets from</span><div class="total mb-3" id="from"></div><a class="btn btn-gold w-100" id="bk"><i class="bi bi-ticket-perforated"></i> Choose your seats</a></div></div></div>
<h2 class="mt-5 mb-4">You may also like</h2><div class="row g-3 g-lg-4" id="rel"></div></div></section>
<div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js"></script><script src="js/data.js"></script><script src="js/main.js"></script><script>

const m=M.find(x=>x.id==new URLSearchParams(location.search).get('id'))||M[0],on=W().includes(m.id);
document.title=m.n+' | '+BN;
$('#gh').innerHTML=`${pic(m,'b','bg')}<div class="container"><div class="row g-4 align-items-end"><div class="col-6 col-md-4 col-lg-3">${pic(m,'p','cover')}</div><div class="col-md-8 col-lg-9"><div class="mb-3"><span class="pill">${m.g}</span>${m.tg.map(t=>`<span class="pill">${t}</span>`).join('')}</div><h1>${esc(m.n)}</h1><div class="d-flex flex-wrap gap-3 my-3 mu"><span class="stars"><i class="bi bi-star-fill"></i> ${m.r.toFixed(1)} / 10</span><span>${m.y}</span><span>${hm(m.rt)}</span><span>${m.c}</span><span>${m.lang}</span></div><p class="it mb-4">Directed by ${esc(m.dir)}</p><div class="d-flex flex-wrap gap-3"><a class="btn btn-gold" href="booking.html?id=${m.id}"><i class="bi bi-ticket-perforated"></i> Book tickets</a><button class="btn btn-glass" data-tr="${m.id}"><i class="bi bi-play-fill"></i> Watch trailer</button><button class="btn btn-line ${on?'on':''}" data-w="${m.id}"><i class="bi bi-bookmark-heart-fill"></i> <span class="wt">${on?'In your watchlist':'Add to watchlist'}</span></button></div></div></div></div>`;
$('#ab').textContent=m.t;
$('#ft').innerHTML=m.f.map(x=>`<li>${esc(x)}</li>`).join('');
$('#cast').innerHTML=m.cast.map(c=>`<div class="castc"><i>${c.split(' ').map(w=>w[0]).slice(0,2).join('')}</i><span>${esc(c)}</span></div>`).join('');
$('#sp').innerHTML=[['Director',m.dir],['Release year',m.y],['Genre',m.g],['Runtime',hm(m.rt)],['Language',m.lang],['Rated',m.c],['Our rating',m.r.toFixed(1)+' / 10']].map(s=>`<div class="spec"><span>${s[0]}</span><b class="text-end">${esc(String(s[1]))}</b></div>`).join('');
$('#from').textContent=money(C.PRICES.Silver);$('#bk').href='booking.html?id='+m.id;
$('#rel').innerHTML=M.filter(x=>x.id!=m.id).sort((a,b)=>((b.g==m.g)-(a.g==m.g))||((b.dir==m.dir)-(a.dir==m.dir))||b.r-a.r).slice(0,4).map(col).join('');reveal();

</script></body></html>
