<!DOCTYPE html><html lang="en" data-bs-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070608"><meta name="description" content="Velvet Reel - a luxury cinema experience. Discover films, save your watchlist and book your seats."><title>Contact | Velvet Reel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070608'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E"><link href="css/style.css" rel="stylesheet"></head><body class="inner"><div id="nav"></div>

<section class="phead"><div class="container" style="max-width:920px"><span class="eyebrow rv">Say hello</span><h1 class="rv">Contact us</h1><p class="mu">Suggest a movie, ask about a booking or just tell us what you loved.</p><div class="row g-4 mt-1"><div class="col-lg-7"><form id="f" class="box needs-validation" novalidate><div class="row g-3"><div class="col-md-6"><input id="n" class="form-control" placeholder="Your name" required></div><div class="col-md-6"><input id="e" type="email" class="form-control" placeholder="Email" required></div><div class="col-12"><select id="t" class="form-select"><option>Suggest a movie</option><option>Booking help</option><option>General question</option></select></div><div class="col-12"><textarea id="m" rows="5" class="form-control" placeholder="Your message" required></textarea></div><div class="col-12"><button class="btn btn-gold">Send message</button></div></div></form></div><div class="col-lg-5"><div class="box h-100"><div class="spec"><span><i class="bi bi-envelope me-2 text-warning"></i>Email</span><b id="ce"></b></div><div class="spec"><span><i class="bi bi-telephone me-2 text-warning"></i>Phone</span><b id="cp"></b></div><div class="spec"><span><i class="bi bi-geo-alt me-2 text-warning"></i>City</span><b id="cc"></b></div><div class="spec"><span><i class="bi bi-clock me-2 text-warning"></i>Box office</span><b>12:00 PM - 11:00 PM</b></div></div></div></div></div></section>
<div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js"></script><script src="js/data.js"></script><script src="js/main.js"></script><script>

$('#ce').textContent=C.EMAIL;$('#cp').textContent=C.PHONE;$('#cc').textContent=C.CITY;
$('#f').onsubmit=e=>{e.preventDefault();const f=e.target;if(!f.checkValidity()){f.classList.add('was-validated');return}
  const a=LS.get('vr_messages',[]);a.push({n:$('#n').value.trim(),e:$('#e').value.trim(),t:$('#t').value,m:$('#m').value.trim(),at:Date.now()});LS.set('vr_messages',a);
  f.reset();f.classList.remove('was-validated');toast('Message sent. Thank you!')};
reveal();

</script></body></html>
