<!DOCTYPE html><html lang="en" data-bs-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070608"><meta name="description" content="Velvet Reel - a luxury cinema experience. Discover films, save your watchlist and book your seats."><title>Movies | Velvet Reel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070608'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E"><link href="css/style.css" rel="stylesheet"></head><body class="inner"><div id="nav"></div>

<section class="phead"><div class="container"><span class="eyebrow rv">The library</span><h1 class="rv">All movies</h1><p class="mu">Search, filter and sort the whole collection.</p></div></section>
<div class="fbar"><div class="container"><div class="row g-2 align-items-center"><div class="col-lg-4"><input id="q" class="form-control" placeholder="Search movie, actor, director or tag..."></div><div class="col-6 col-lg-2"><select id="lg" class="form-select"><option value="">All languages</option></select></div><div class="col-6 col-lg-2"><select id="dc" class="form-select"><option value="">Any era</option><option value="2020">2020s</option><option value="2010">2010s</option><option value="2000">2000s</option><option value="1990">1990s</option><option value="1900">Before 1990</option></select></div><div class="col-6 col-lg-2"><select id="s" class="form-select"><option value="0">Featured</option><option value="1">Top rated</option><option value="2">Newest</option><option value="3">Oldest</option><option value="4">Longest</option><option value="5">Shortest</option></select></div><div class="col-6 col-lg-2 text-lg-end mu" id="cnt"></div></div><div class="d-flex flex-wrap gap-2 mt-3" id="chips"></div></div></div>
<section class="sec pt-4"><div class="container"><div class="row g-3 g-lg-4" id="grid"></div></div></section>
<div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js"></script><script src="js/data.js"></script><script src="js/main.js"></script><script>

const P=new URLSearchParams(location.search);
const gs=['All',...new Set(M.map(x=>x.g))];let gen=P.get('g')||'All';if(!gs.includes(gen))gen='All';
$('#q').value=P.get('q')||'';
$('#lg').innerHTML+=[...new Set(M.map(x=>x.lang))].map(l=>`<option>${l}</option>`).join('');
function chips(){$('#chips').innerHTML=gs.map(x=>`<button class="chip ${x==gen?'on':''}" data-g="${x}">${x}</button>`).join('')}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b){gen=b.dataset.g;chips();draw()}};
function draw(){
  const q=$('#q').value.toLowerCase().trim(),l=$('#lg').value,d=$('#dc').value,s=$('#s').value;
  let a=M.filter(x=>(gen=='All'||x.g==gen)&&(!l||x.lang==l)&&(!d||(d=='1900'?x.y<1990:(x.y>=+d&&x.y<+d+10)))&&(x.n+' '+x.dir+' '+x.cast.join(' ')+' '+x.tg.join(' ')+' '+x.g+' '+x.y).toLowerCase().includes(q));
  const so={1:(x,y)=>y.r-x.r,2:(x,y)=>y.y-x.y,3:(x,y)=>x.y-y.y,4:(x,y)=>y.rt-x.rt,5:(x,y)=>x.rt-y.rt};if(so[s])a.sort(so[s]);
  $('#cnt').textContent=a.length+' movie'+(a.length==1?'':'s');
  $('#grid').innerHTML=a.length?a.map(col).join(''):'<p class="empty">No movies match. Try another search or filter.</p>';reveal();
}
$('#q').oninput=$('#lg').onchange=$('#dc').onchange=$('#s').onchange=draw;chips();draw();

</script></body></html>
